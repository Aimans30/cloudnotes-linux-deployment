{% extends "base.html" %}
{% block title %}{{ note.title }} · CloudNotes{% endblock %}
{% block content %}
<article class="note-view">
  <header class="page-header">
    <h1>{{ note.title }}</h1>
  </header>
  <dl class="note-meta">
    <div><dt>Created</dt><dd><time datetime="{{ note.created_at.isoformat() }}">{{ note.created_at|timestamp }}</time></dd></div>
    <div><dt>Updated</dt><dd><time datetime="{{ note.updated_at.isoformat() }}">{{ note.updated_at|timestamp }}</time></dd></div>
    <div><dt>ID</dt><dd>{{ note.id }}</dd></div>
  </dl>
  <div class="note-body">{{ note.content or "This note has no content." }}</div>
  <div class="form-actions">
    <a class="button" href="{{ url_for('notes.index') }}">Back</a>
    <a class="button button-primary" href="{{ url_for('notes.edit_note', note_id=note.id) }}">Edit</a>
    <form method="post" action="{{ url_for('notes.delete_note', note_id=note.id) }}"
          data-confirm="Delete &quot;{{ note.title }}&quot;? This cannot be undone.">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="button button-danger" data-loading-text="Deleting&hellip;">Delete</button>
    </form>
  </div>
</article>
{% endblock %}
