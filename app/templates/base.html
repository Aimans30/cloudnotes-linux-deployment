<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CloudNotes{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('notes.index') }}">CloudNotes</a>
    <nav class="site-nav">
      <a href="{{ url_for('notes.index') }}">All notes</a>
      <a class="button button-primary" href="{{ url_for('notes.new_note') }}">New note</a>
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">CloudNotes &middot; Flask, Gunicorn and PostgreSQL</footer>
</body>
</html>
